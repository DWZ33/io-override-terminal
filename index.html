<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMAGINED ORDER // OVERRIDE_TERMINAL</title>
    <style>
        :root {
            --io-blue: #00d2ff;
            --io-dark: rgba(10, 17, 24, 0.88);
            --io-bg: #03070c;
            --io-alert: #ff3b3b;
            --terminal-font: 'Courier New', Courier, monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--io-bg);
            /* Raw GitHub image URL with semi-transparent dark overlay for legibility */
            background-image: linear-gradient(rgba(3, 7, 12, 0.75), rgba(3, 7, 12, 0.75)), url('Fortnite_Override_JonesyBanner.jpeg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            color: var(--io-blue);
            font-family: var(--terminal-font);
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* CRT Screen Scanline Overlay */
        .crt::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 99;
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
        }

        .terminal-container {
            width: 100%;
            max-width: 850px;
            height: 90vh;
            max-height: 650px;
            background-color: var(--io-dark);
            backdrop-filter: blur(8px);
            border: 2px solid var(--io-blue);
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.3);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .terminal-header {
            background-color: rgba(0, 210, 255, 0.1);
            padding: 12px 20px;
            border-bottom: 2px solid var(--io-blue);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            background-color: var(--io-blue);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 8px var(--io-blue);
            animation: blink 1.5s infinite;
        }

        .terminal-body {
            flex: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .screen-section {
            width: 100%;
            display: none;
        }

        .screen-section.active {
            display: block;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        p.subtitle {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 30px;
        }

        .input-wrapper {
            margin-bottom: 20px;
            width: 100%;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        input[type="text"] {
            width: 100%;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--io-blue);
            padding: 12px;
            color: var(--io-blue);
            font-family: var(--terminal-font);
            font-size: 16px;
            text-align: center;
            outline: none;
            box-shadow: inset 0 0 5px rgba(0, 210, 255, 0.1);
        }

        input[type="text"]:focus {
            box-shadow: 0 0 10px rgba(0, 210, 255, 0.3), inset 0 0 5px rgba(0, 210, 255, 0.2);
        }

        button {
            background-color: var(--io-blue);
            color: #000;
            border: none;
            padding: 12px 30px;
            font-family: var(--terminal-font);
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #fff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
        }

        .error-msg {
            color: var(--io-alert);
            margin-top: 15px;
            font-size: 13px;
            height: 15px;
        }

        .hacked-container {
            text-align: left;
            height: 100%;
        }

        .alert-banner {
            background-color: rgba(255, 59, 59, 0.15);
            border: 1px dashed var(--io-alert);
            color: var(--io-alert);
            padding: 10px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
            animation: pulse 2s infinite;
        }

        .tabs {
            display: flex;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--io-blue);
            margin-bottom: 15px;
            gap: 5px;
        }

        .tab-btn {
            background: transparent;
            color: var(--io-blue);
            border: 1px solid var(--io-blue);
            border-bottom: none;
            padding: 8px 12px;
            font-size: 11px;
            cursor: pointer;
        }

        .tab-btn.active {
            background-color: rgba(0, 210, 255, 0.25);
            font-weight: bold;
        }

        .file-content {
            background-color: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(0, 210, 255, 0.3);
            padding: 20px;
            font-size: 13px;
            line-height: 1.6;
            height: 320px;
            overflow-y: auto;
            white-space: pre-line;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .terminal-container.breached {
            border-color: var(--io-alert);
            box-shadow: 0 0 25px rgba(255, 59, 59, 0.3);
        }
        .terminal-container.breached .status-dot {
            background-color: var(--io-alert);
            box-shadow: 0 0 8px var(--io-alert);
        }
        .terminal-container.breached .terminal-header {
            background-color: rgba(255, 59, 59, 0.1);
            border-bottom-color: var(--io-alert);
        }
    </style>
</head>
<body class="crt">

    <div class="terminal-container" id="terminal">
        <div class="terminal-header">
            <span>IMAGINED_ORDER // MAINFRAME_v7.4</span>
            <div>
                <span class="status-dot"></span>
                <span id="system-status">SYS_SECURE</span>
            </div>
        </div>

        <div class="terminal-body">
            <!-- Screen 1: Login -->
            <div class="screen-section active" id="login-screen">
                <h1>SYSTEM ACCESS REQUIRED</h1>
                <p class="subtitle">INPUT OVERRIDE DECRYPTION KEY TO VIEW CLASSIFIED FILES</p>
                
                <div class="input-wrapper">
                    <input type="text" id="override-input" placeholder="ENTER ADMIN KEYPHRASE..." autocomplete="off">
                </div>
                <button onclick="checkKeyphrase()">SUBMIT OVERRIDE</button>
                <div class="error-msg" id="error-box"></div>
            </div>

            <!-- Screen 2: Unlocked Archives -->
            <div class="screen-section" id="archive-screen">
                <div class="hacked-container">
                    <div class="alert-banner">⚠️ SYSTEM BREACH DETECTED // AUDIO LOG ARCHIVE UNLOCKED</div>
                    
                    <div class="tabs">
                        <button class="tab-btn active" id="btn-story" onclick="switchTab('story')">THE STORY SO FAR</button>
                        <button class="tab-btn" id="btn-bunker" onclick="switchTab('bunker')">FILE_01: SNAPSHOTS</button>
                        <button class="tab-btn" id="btn-visitor" onclick="switchTab('visitor')">FILE_02: THE INFILTRATOR</button>
                        <button class="tab-btn" id="btn-reality" onclick="switchTab('reality')">FILE_03: THE TRAP</button>
                    </div>

                    <div class="file-content" id="data-display"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const loreDatabase = {
            story: `[AUDIO LOG RECOVERY: COMPILATION ARCHIVE]
Target Audience: Casual Loopers & Field Operatives

=== LOG 001 // THE ZERO POINT DISCOVERY ===
TRANSCRIPT: "The anomaly is contained... for now. Every time a Looper enters, the system resets memory in a 22-minute sequence. If anyone tries to leave, they leave a genetic duplicate—a Snapshot."

=== LOG 002 // THE SEVEN'S INTERVENTION ===
TRANSCRIPT: "They're operating outside the perimeter. Bunkers... isolated from the reset wave. They aren't affected by the memory wipe. They're trying to break the Loop from the subterranean layer."

=== LOG 003 // GENO'S DIRECTIVE ===
TRANSCRIPT: "Order will be maintained across all realities. Let them fight. Let them adapt. The best DNA will survive each cycle."`,

            bunker: `[LOG CLASSIFIED: TOP SECRET]
Source: Save The World / Zero Point Mechanics

The Seven and original loopers do not actively step onto the island combat zone without protection. They operate from subterranean bunkers deep outside the immediate visual footprint of the Zero Point.

Every deployment onto the battlefield leaves behind a physical artifact: "Snapshots"—exact genetic duplicates possessing wiped short-term memories.`,

            visitor: `[IDENTITY AUDIT: HIGH PRIORITY]
Subject: The Visitor
Status: Compromised

Geno used the Zero Point to monitor all visitors. Those who attempt to break the loop are tracked, studied, and isolated before they can disrupt the IO network footprint.`,

            reality: `[PROJECT: OMNIVERSE CONTROL]
Subject: Geno / Imagined Order

The Loop was designed as an absolute containment system. Resetting matter and memory every 22 minutes creates a microcosm of perfect control.`
        };

        const passkey = "yourthoughtsaremine";

        function checkKeyphrase() {
            const inputVal = document.getElementById("override-input").value.trim().toLowerCase();
            const errorBox = document.getElementById("error-box");

            if (inputVal === passkey) {
                document.getElementById("login-screen").classList.remove("active");
                document.getElementById("archive-screen").classList.add("active");
                document.getElementById("terminal").classList.add("breached");
                document.getElementById("system-status").innerText = "SYS_BREACHED";
                switchTab('story');
            } else {
                errorBox.innerText = "ACCESS DENIED: INVALID KEYPHRASE";
            }
        }

        function switchTab(tabKey) {
            document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
            const activeBtn = document.getElementById(`btn-${tabKey}`);
            if (activeBtn) activeBtn.classList.add("active");

            document.getElementById("data-display").innerText = loreDatabase[tabKey] || "NO DATA FOUND.";
        }

        document.getElementById("override-input").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                checkKeyphrase();
            }
        });
    </script>
</body>
</html>
